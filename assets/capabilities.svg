<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae2fd" />
    </linearGradient>
  </defs>

  <style>
    @keyframes eq1 { 0%, 100% { height: 6px; y: 194px; } 50% { height: 26px; y: 174px; } }
    @keyframes eq2 { 0%, 100% { height: 18px; y: 182px; } 50% { height: 8px; y: 192px; } }
    @keyframes eq3 { 0%, 100% { height: 12px; y: 188px; } 50% { height: 28px; y: 172px; } }
    @keyframes eq4 { 0%, 100% { height: 24px; y: 176px; } 50% { height: 10px; y: 190px; } }
    @keyframes eq5 { 0%, 100% { height: 14px; y: 186px; } 50% { height: 24px; y: 176px; } }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes barAnim1 { 0% { width: 0; } 100% { width: 340px; } }
    @keyframes barAnim2 { 0% { width: 0; } 100% { width: 320px; } }
    @keyframes barAnim3 { 0% { width: 0; } 100% { width: 290px; } }
    @keyframes barAnim4 { 0% { width: 0; } 100% { width: 270px; } }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .eq-1 { animation: eq1 1.2s ease-in-out infinite; }
    .eq-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-3 { animation: eq3 1.5s ease-in-out infinite; }
    .eq-4 { animation: eq4 1.1s ease-in-out infinite; }
    .eq-5 { animation: eq5 1.3s ease-in-out infinite; }
    .bar-1 { animation: barAnim1 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-2 { animation: barAnim2 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-3 { animation: barAnim3 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-4 { animation: barAnim4 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .radar-line { animation: radarSweep 4s linear infinite; transform-origin: 790px 75px; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#hudBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Divider -->
  <line x1="450" y1="20" x2="450" y2="220" stroke="#1e293b" stroke-dasharray="3,3" />

  <!-- LEFT PANE: Systems & Performance Index -->
  <text x="35" y="42" class="mono" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="1">┌─ SYSTEMS &amp; ENGINE SPECS ──────────┐</text>

  <!-- Capability 1 -->
  <text x="35" y="74" class="mono" font-size="11" fill="#cbd5e1">DOM Perception &amp; Form Solvers</text>
  <text x="415" y="74" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">98%</text>
  <rect x="35" y="81" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="81" height="5" rx="2.5" fill="url(#accentBar)" class="bar-1" />

  <!-- Capability 2 -->
  <text x="35" y="112" class="mono" font-size="11" fill="#cbd5e1">Full-Stack Reactive Apps (React 18 / Next)</text>
  <text x="415" y="112" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">94%</text>
  <rect x="35" y="119" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="119" height="5" rx="2.5" fill="url(#accentBar)" class="bar-2" />

  <!-- Capability 3 -->
  <text x="35" y="150" class="mono" font-size="11" fill="#cbd5e1">Database &amp; Schema Security (Supabase / RLS)</text>
  <text x="415" y="150" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">88%</text>
  <rect x="35" y="157" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="157" height="5" rx="2.5" fill="url(#accentBar)" class="bar-3" />

  <!-- Audio / Equalizer Signal on bottom left -->
  <g fill="#38bdf8">
    <rect x="35" y="190" width="3" height="10" rx="1.5" class="eq-1" />
    <rect x="42" y="190" width="3" height="10" rx="1.5" class="eq-2" />
    <rect x="49" y="190" width="3" height="10" rx="1.5" class="eq-3" />
    <rect x="56" y="190" width="3" height="10" rx="1.5" class="eq-4" />
    <rect x="63" y="190" width="3" height="10" rx="1.5" class="eq-5" />
  </g>
  <text x="75" y="200" class="mono" font-size="10" fill="#64748b">SIGNAL: CONTINUOUS STREAM (UTC+05:30)</text>

  <!-- RIGHT PANE: Flagship Deployment Telemetry -->
  <text x="480" y="42" class="mono" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="1">┌─ FLAGSHIP :: NOMADIC OS ──────────┐</text>

  <!-- Radar HUD Graphic -->
  <circle cx="790" cy="75" r="28" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="790" cy="75" r="16" fill="none" stroke="#1e293b" stroke-width="1" />
  <circle cx="790" cy="75" r="4" fill="#38bdf8" />
  <line x1="790" y1="75" x2="818" y2="75" stroke="#0284c7" stroke-width="2" class="radar-line" />

  <g class="mono" font-size="11">
    <text x="480" y="74" fill="#64748b">CORE      :: <tspan fill="#ffffff" font-weight="600">Universal Career OS &amp; Autopilot</tspan></text>
    <text x="480" y="98" fill="#64748b">LIVE      :: <tspan fill="#bae2fd">nomadicai.vercel.app</tspan></text>
    <text x="480" y="122" fill="#64748b">ENGINE    :: <tspan fill="#e2e8f0">OmniForm React DOM Prototype Setter</tspan></text>
    <text x="480" y="146" fill="#64748b">BENCHMARK :: <tspan fill="#38bdf8">&lt; 30ms Client Query State Sync</tspan></text>
  </g>

  <!-- Tech Badges -->
  <g class="mono" font-size="10">
    <rect x="480" y="172" width="75" height="24" rx="4" fill="#1e293b" />
    <text x="517" y="188" text-anchor="middle" fill="#cbd5e1">React 18</text>

    <rect x="562" y="172" width="78" height="24" rx="4" fill="#1e293b" />
    <text x="601" y="188" text-anchor="middle" fill="#cbd5e1">Supabase</text>

    <rect x="647" y="172" width="72" height="24" rx="4" fill="#1e293b" />
    <text x="683" y="188" text-anchor="middle" fill="#cbd5e1">Electron</text>

    <rect x="726" y="172" width="105" height="24" rx="4" fill="#031d33" stroke="#0284c7" stroke-width="1" />
    <text x="778" y="188" text-anchor="middle" fill="#38bdf8" font-weight="700">OmniForm v1.0</text>
  </g>
</svg>
