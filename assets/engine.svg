<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae2fd" />
    </linearGradient>
    <filter id="barGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes loadBar1 { 0% { width: 0; } 100% { width: 330px; } }
    @keyframes loadBar2 { 0% { width: 0; } 100% { width: 315px; } }
    @keyframes loadBar3 { 0% { width: 0; } 100% { width: 295px; } }
    @keyframes loadBar4 { 0% { width: 0; } 100% { width: 275px; } }
    @keyframes pulseRing {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .bar-1 { animation: loadBar1 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-2 { animation: loadBar2 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-3 { animation: loadBar3 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-4 { animation: loadBar4 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .radar-pulse { animation: pulseRing 3s ease-in-out infinite; transform-origin: 775px 50px; }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="846" height="236" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Vertical Divider -->
  <line x1="435" y1="20" x2="435" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

  <!-- LEFT PANE: Systems & Performance Index -->
  <text x="30" y="38" class="mono" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">┌─ CAPABILITY TELEMETRY ────────────┐</text>

  <!-- Metric 1 -->
  <text x="30" y="70" class="mono" font-size="11" fill="#cbd5e1">DOM &amp; Form Automation Engine</text>
  <text x="395" y="70" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">98%</text>
  <rect x="30" y="77" width="365" height="5" rx="2.5" fill="#1e293b" />
  <rect x="30" y="77" height="5" rx="2.5" fill="url(#barGrad)" class="bar-1" filter="url(#barGlow)" />

  <!-- Metric 2 -->
  <text x="30" y="112" class="mono" font-size="11" fill="#cbd5e1">Full-Stack &amp; Distributed Systems</text>
  <text x="395" y="112" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">94%</text>
  <rect x="30" y="119" width="365" height="5" rx="2.5" fill="#1e293b" />
  <rect x="30" y="119" height="5" rx="2.5" fill="url(#barGrad)" class="bar-2" filter="url(#barGlow)" />

  <!-- Metric 3 -->
  <text x="30" y="154" class="mono" font-size="11" fill="#cbd5e1">Database &amp; Schema Security (RLS)</text>
  <text x="395" y="154" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">88%</text>
  <rect x="30" y="161" width="365" height="5" rx="2.5" fill="#1e293b" />
  <rect x="30" y="161" height="5" rx="2.5" fill="url(#barGrad)" class="bar-3" filter="url(#barGlow)" />

  <!-- Metric 4 -->
  <text x="30" y="196" class="mono" font-size="11" fill="#cbd5e1">Native Desktop &amp; CDP Automation</text>
  <text x="395" y="196" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">82%</text>
  <rect x="30" y="203" width="365" height="5" rx="2.5" fill="#1e293b" />
  <rect x="30" y="203" height="5" rx="2.5" fill="url(#barGrad)" class="bar-4" filter="url(#barGlow)" />

  <!-- RIGHT PANE: Flagship System Specs -->
  <text x="465" y="38" class="mono" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">┌─ FLAGSHIP :: NOMADIC OS ─────────┐</text>

  <!-- Radar Pulse Signal on top-right -->
  <circle cx="775" cy="50" r="14" fill="none" stroke="#0284c7" stroke-width="1" class="radar-pulse" />
  <circle cx="775" cy="50" r="5" fill="#38bdf8" />
  <text x="760" y="75" class="mono" font-size="9" fill="#64748b" text-anchor="middle">ALPHA</text>

  <g class="mono" font-size="11">
    <text x="465" y="70" fill="#64748b">CORE      :: <tspan fill="#ffffff" font-weight="600">Universal Career OS &amp; Pilot</tspan></text>
    <text x="465" y="96" fill="#64748b">DEPLOYED  :: <tspan fill="#bae2fd">nomadicai.vercel.app</tspan></text>
    <text x="465" y="122" fill="#64748b">ENGINE    :: <tspan fill="#e2e8f0">OmniForm Solver (&gt;95% accuracy)</tspan></text>
    <text x="465" y="148" fill="#64748b">LATENCY   :: <tspan fill="#38bdf8">Sub-30ms client query sync</tspan></text>
  </g>

  <!-- Mini Tech Tags -->
  <g class="mono" font-size="10">
    <rect x="465" y="175" width="75" height="24" rx="4" fill="#1e293b" />
    <text x="502" y="191" text-anchor="middle" fill="#cbd5e1">React 18</text>

    <rect x="548" y="175" width="75" height="24" rx="4" fill="#1e293b" />
    <text x="585" y="191" text-anchor="middle" fill="#cbd5e1">Supabase</text>

    <rect x="631" y="175" width="75" height="24" rx="4" fill="#1e293b" />
    <text x="668" y="191" text-anchor="middle" fill="#cbd5e1">Electron</text>

    <rect x="714" y="175" width="95" height="24" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="761" y="191" text-anchor="middle" fill="#38bdf8" font-weight="600">OmniForm</text>
  </g>
</svg>
