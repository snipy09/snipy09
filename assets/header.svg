<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c0e15" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan { 0% { transform: translateY(-30px); } 100% { transform: translateY(290px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.88); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes textFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .ascii-text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: 800;
      fill: #bae2fd;
      filter: url(#glow);
      animation: textFloat 3.5s ease-in-out infinite;
    }
    .scanner { animation: scan 4s linear infinite; }
    .status-pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: 790px 22px; }
    .cursor-blink { animation: blink 0.9s step-end infinite; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="876" height="286" rx="10" fill="url(#headerBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <line x1="2" y1="40" x2="878" y2="40" stroke="#1e293b" stroke-width="1" />
  
  <circle cx="24" cy="21" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />
  <circle cx="40" cy="21" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />
  <circle cx="56" cy="21" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />

  <text x="440" y="25" text-anchor="middle" class="mono" font-size="11.5" fill="#64748b" letter-spacing="1">snipy09@workstation:~ (zsh)</text>

  <!-- Live Status Pill -->
  <rect x="715" y="11" width="135" height="20" rx="4" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="730" cy="21" r="3.5" fill="#38bdf8" class="status-pulse" />
  <text x="742" y="25" class="mono" font-size="9.5" fill="#bae2fd" font-weight="700" letter-spacing="1">SYSTEM READY</text>

  <!-- Scanning Beam -->
  <g class="scanner">
    <rect x="2" y="0" width="876" height="30" fill="url(#scanBeam)" pointer-events="none" />
  </g>

  <!-- ASCII Header -->
  <g class="ascii-text">
    <text x="440" y="82" text-anchor="middle">███████╗███╗   ██╗██╗██████╗ ██╗   ██╗ ██████╗  █████╗ </text>
    <text x="440" y="99" text-anchor="middle">██╔════╝████╗  ██║██║██╔══██╗╚██╗ ██╔╝██╔═████╗██╔══██╗</text>
    <text x="440" y="116" text-anchor="middle">███████╗██╔██╗ ██║██║██████╔╝ ╚████╔╝ ██║██╔██║╚██████║</text>
    <text x="440" y="133" text-anchor="middle">╚════██║██║╚██╗██║██║██╔═══╝   ╚██╔╝  ████╔╝██║ ╚═══██║</text>
    <text x="440" y="150" text-anchor="middle">███████║██║ ╚████║██║██║        ██║   ╚██████╔╝ █████╔╝</text>
    <text x="440" y="167" text-anchor="middle">╚══════╝╚═╝  ╚═══╝╚═╝╚═╝        ╚═╝    ╚═════╝  ╚════╝ </text>
  </g>

  <!-- Subtitle -->
  <text x="440" y="200" text-anchor="middle" class="mono" font-size="11.5" fill="#94a3b8" letter-spacing="2">SAJAL KUMAR MISHRA // SYSTEMS ARCHITECT &amp; FULL-STACK BUILDER</text>

  <!-- Divider -->
  <line x1="30" y1="222" x2="850" y2="222" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Bottom Terminal Command Output -->
  <g class="mono" font-size="11">
    <text x="40" y="250" fill="#64748b">snipy09@system:~$ <tspan fill="#bae2fd">init --profile=sajal --engine=nomadic --state=active</tspan></text>
    <text x="40" y="272" fill="#0284c7">» <tspan fill="#cbd5e1">Flagship: Nomadic Career OS | DOM OmniForm Solver | Sub-30ms Query Engine</tspan><tspan fill="#38bdf8" class="cursor-blink"> █</tspan></text>
  </g>
</svg>
