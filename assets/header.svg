<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#bae2fd" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae2fd" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae2fd" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes scanline {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(260px); }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .status-dot {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: 795px 26px;
    }
    .cursor {
      animation: cursorBlink 0.9s step-end infinite;
      fill: #38bdf8;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#ambientGlow)" pointer-events="none" />

  <!-- Top Window Header -->
  <line x1="2" y1="48" x2="898" y2="48" stroke="#1e293b" stroke-width="1" />
  
  <!-- Minimal Window Controls -->
  <circle cx="28" cy="25" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />
  <circle cx="44" cy="25" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />
  <circle cx="60" cy="25" r="4.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />

  <text x="450" y="30" text-anchor="middle" class="mono" font-size="12" fill="#64748b" letter-spacing="1">snipy09@workstation:~ (zsh)</text>

  <!-- Live Status Badge -->
  <rect x="730" y="15" width="135" height="22" rx="5" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="745" cy="26" r="3.5" fill="#38bdf8" class="status-dot" />
  <text x="758" y="30" class="mono" font-size="10.5" fill="#bae2fd" font-weight="700" letter-spacing="1">ACTIVE // SHIPPING</text>

  <!-- Main Identity Banner -->
  <g class="sans">
    <text x="45" y="105" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Sajal Kumar Mishra</text>
    <text x="45" y="132" font-size="14" font-weight="500" fill="#bae2fd" letter-spacing="0.2">Systems Architect &amp; Full-Stack Builder</text>
    <text x="45" y="162" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0">Crafting high-throughput automation engines, deterministic web systems &amp; resilient client architectures.</text>
  </g>

  <!-- Tag Pills -->
  <g class="mono" font-size="10.5">
    <rect x="45" y="185" width="130" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="201" text-anchor="middle" fill="#cbd5e1">DOM PERCEPTION</text>

    <rect x="185" y="185" width="145" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="257" y="201" text-anchor="middle" fill="#cbd5e1">REACT 18 &amp; NEXT.JS</text>

    <rect x="340" y="185" width="130" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="405" y="201" text-anchor="middle" fill="#cbd5e1">SUPABASE &amp; RLS</text>

    <rect x="480" y="185" width="150" height="24" rx="4" fill="#031d33" stroke="#0284c7" stroke-width="1" />
    <text x="555" y="201" text-anchor="middle" fill="#38bdf8" font-weight="600">NOMADIC CAREER OS</text>
  </g>

  <!-- Bottom Terminal Command Line -->
  <line x1="2" y1="222" x2="898" y2="222" stroke="#1e293b" stroke-width="1" />
  <g class="mono" font-size="11">
    <text x="30" y="242" fill="#64748b">snipy09@system:~$ <tspan fill="#bae2fd">launch nomadic --runtime=desktop --sync=sub-30ms</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
