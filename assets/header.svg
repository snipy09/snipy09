<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.07" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae2fd" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(310px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }
    @keyframes textShimmer {
      0%, 100% { fill: #bae2fd; }
      50% { fill: #e0f2fe; }
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
    }
    .ascii-art {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
      font-size: 13.5px;
      font-weight: 800;
      fill: #bae2fd;
      animation: textShimmer 4s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }
    .cursor {
      animation: blink 0.9s step-end infinite;
      fill: #38bdf8;
    }
    .status-dot {
      animation: pulse 1.8s ease-in-out infinite;
      transform-origin: 730px 22px;
    }
    .scan-beam {
      animation: scan 5s linear infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="306" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Bar -->
  <line x1="2" y1="42" x2="848" y2="42" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <circle cx="42" cy="22" r="5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <circle cx="60" cy="22" r="5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />

  <text x="425" y="26" text-anchor="middle" class="mono" font-size="12" fill="#64748b" letter-spacing="1">snipy09@workstation:~ (zsh)</text>

  <!-- Live Status Badge -->
  <rect x="715" y="12" width="112" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="728" cy="22" r="3.5" fill="#38bdf8" class="status-dot" />
  <text x="738" y="26" class="mono" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">LIVE OPS</text>

  <!-- Scanline Beam -->
  <g class="scan-beam">
    <rect x="2" y="0" width="846" height="35" fill="url(#scanline)" pointer-events="none" />
  </g>

  <!-- ASCII Header -->
  <g class="ascii-art">
    <text x="425" y="86" text-anchor="middle">███████╗███╗   ██╗██╗██████╗ ██╗   ██╗ ██████╗  █████╗ </text>
    <text x="425" y="104" text-anchor="middle">██╔════╝████╗  ██║██║██╔══██╗╚██╗ ██╔╝██╔═████╗██╔══██╗</text>
    <text x="425" y="122" text-anchor="middle">███████╗██╔██╗ ██║██║██████╔╝ ╚████╔╝ ██║██╔██║╚██████║</text>
    <text x="425" y="140" text-anchor="middle">╚════██║██║╚██╗██║██║██╔═══╝   ╚██╔╝  ████╔╝██║ ╚═══██║</text>
    <text x="425" y="158" text-anchor="middle">███████║██║ ╚████║██║██║        ██║   ╚██████╔╝ █████╔╝</text>
    <text x="425" y="176" text-anchor="middle">╚══════╝╚═╝  ╚═══╝╚═╝╚═╝        ╚═╝    ╚═════╝  ╚════╝ </text>
  </g>

  <!-- Identity Subtitle -->
  <text x="425" y="210" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8" letter-spacing="2">SAJAL KUMAR MISHRA // SYSTEMS ARCHITECT &amp; FULL-STACK BUILDER</text>

  <!-- Divider -->
  <line x1="30" y1="234" x2="820" y2="234" stroke="#1e293b" stroke-width="1" />

  <!-- Bottom Telemetry Grid -->
  <g class="mono" font-size="11.5">
    <text x="45" y="262" fill="#64748b">FLAGSHIP  :: <tspan fill="#e2e8f0" font-weight="600">Nomadic (Universal Career OS)</tspan></text>
    <text x="45" y="286" fill="#64748b">CORE TECH :: <tspan fill="#bae2fd">TypeScript, React 18, Supabase, Python, Electron</tspan></text>

    <text x="540" y="262" fill="#64748b">DOMAINS :: <tspan fill="#e2e8f0">DOM Engines &amp; Scalable SaaS</tspan></text>
    <text x="540" y="286" fill="#64748b">STATUS  :: <tspan fill="#38bdf8">Continuous Shipping</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
