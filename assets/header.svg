<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0c0d12" />
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#bae2fd" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(360px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    @keyframes typeEffect {
      0% { width: 0; }
      50%, 100% { width: 100%; }
    }
    .ascii-text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #bae2fd;
      letter-spacing: 0px;
      filter: drop-shadow(0 0 8px rgba(186, 226, 253, 0.35));
    }
    .title-bar {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 12px;
      fill: #64748b;
    }
    .status-text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 11px;
      fill: #38bdf8;
      font-weight: 600;
    }
    .subtitle {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 12px;
      fill: #94a3b8;
      letter-spacing: 2px;
    }
    .prompt-text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .cursor {
      animation: blink 1s step-end infinite;
      fill: #38bdf8;
    }
    .status-dot {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: 792px 25px;
    }
    .scan-bar {
      animation: scanline 6s linear infinite;
    }
  </style>

  <!-- Window Container -->
  <rect x="2" y="2" width="836" height="356" rx="8" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Bar -->
  <line x1="2" y1="40" x2="838" y2="40" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="42" cy="22" r="5.5" fill="#eab308" opacity="0.8" />
  <circle cx="60" cy="22" r="5.5" fill="#22c55e" opacity="0.8" />

  <text x="420" y="25" text-anchor="middle" class="title-bar">snipy09@workstation:~ (zsh)</text>

  <!-- Live Status Badge -->
  <circle cx="725" cy="22" r="4" fill="#38bdf8" class="status-dot" />
  <text x="735" y="25" class="status-text">SYSTEM ONLINE</text>

  <!-- Scanline Layer -->
  <g class="scan-bar">
    <rect x="2" y="0" width="836" height="40" fill="url(#scanlineGrad)" pointer-events="none" />
  </g>

  <!-- ASCII Art Block -->
  <g class="ascii-text">
    <text x="420" y="85" text-anchor="middle">███████╗███╗   ██╗██╗██████╗ ██╗   ██╗ ██████╗  █████╗ </text>
    <text x="420" y="103" text-anchor="middle">██╔════╝████╗  ██║██║██╔══██╗╚██╗ ██╔╝██╔═████╗██╔══██╗</text>
    <text x="420" y="121" text-anchor="middle">███████╗██╔██╗ ██║██║██████╔╝ ╚████╔╝ ██║██╔██║╚██████║</text>
    <text x="420" y="139" text-anchor="middle">╚════██║██║╚██╗██║██║██╔═══╝   ╚██╔╝  ████╔╝██║ ╚═══██║</text>
    <text x="420" y="157" text-anchor="middle">███████║██║ ╚████║██║██║        ██║   ╚██████╔╝ █████╔╝</text>
    <text x="420" y="175" text-anchor="middle">╚══════╝╚═╝  ╚═══╝╚═╝╚═╝        ╚═╝    ╚═════╝  ╚════╝ </text>
  </g>

  <!-- Subtitle -->
  <text x="420" y="210" text-anchor="middle" class="subtitle">┌─ SAJAL KUMAR MISHRA // SYSTEMS ARCHITECT &amp; FULL-STACK BUILDER ─┐</text>

  <!-- Divider -->
  <line x1="40" y1="235" x2="800" y2="235" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1" />

  <!-- Terminal Session Interactive Output -->
  <g class="prompt-text">
    <text x="50" y="270" fill="#64748b">snipy09@system:~$ <tspan fill="#bae2fd">init --mode=architect --engine=omniform --stack=full</tspan></text>
    <text x="50" y="295" fill="#38bdf8">» <tspan fill="#cbd5e1">Nomadic Career OS active | Sub-30ms client state synced | 24/7 continuous ops</tspan></text>
    <text x="50" y="325" fill="#64748b">snipy09@system:~$ <tspan fill="#38bdf8">exec autopilot</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
