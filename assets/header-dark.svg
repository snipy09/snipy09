<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sajal Kumar Mishra — AI products, quant systems, automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#111522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="96" fill="#94a3b8" font-size="18" letter-spacing="3">HI, I'M</text>
    <text x="72" y="160" fill="#f8fafc" font-size="56" font-weight="700" letter-spacing="-1">Sajal Kumar Mishra</text>
    <rect x="72" y="184" width="88" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="232" fill="#cbd5e1" font-size="22">I build AI products, quant research tools and automation that ships.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b" text-anchor="end">
    <text x="1128" y="96">AI products</text>
    <text x="1128" y="124">Quant finance</text>
    <text x="1128" y="152">Full-stack</text>
    <text x="1128" y="180">Automation</text>
  </g>
  <g fill="#7dd3fc">
    <circle cx="1146" cy="91" r="3"/>
    <circle cx="1146" cy="119" r="3" fill="#93c5fd"/>
    <circle cx="1146" cy="147" r="3" fill="#a5b4fc"/>
    <circle cx="1146" cy="175" r="3" fill="#a78bfa"/>
  </g>
</svg>
