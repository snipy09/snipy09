<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#bae2fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(320px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .title-ascii {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 13px;
      font-weight: 900;
      fill: #bae2fd;
      filter: url(#glow);
      animation: floatText 4s ease-in-out infinite;
    }
    .scanner { animation: scan 4.5s linear infinite; }
    .status-pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 805px 25px; }
    .cursor-blink { animation: blink 1s step-end infinite; }
  </style>

  <!-- Frame & Background -->
  <rect x="2" y="2" width="896" height="316" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Corner HUD Accents -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 884 35 L 884 16 L 865 16" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 16 285 L 16 304 L 35 304" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 884 285 L 884 304 L 865 304" fill="none" stroke="#0284c7" stroke-width="2" />

  <!-- Top Title Bar -->
  <line x1="16" y1="45" x2="884" y2="45" stroke="#1e293b" stroke-width="1" />
  <text x="35" y="30" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">SNIPY09 // AUTONOMOUS WORKSTATION v2.4</text>
  
  <!-- Status Badge -->
  <rect x="725" y="16" width="140" height="20" rx="4" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="740" cy="26" r="4" fill="#38bdf8" class="status-pulse" />
  <text x="752" y="30" class="mono" font-size="10" fill="#bae2fd" font-weight="700" letter-spacing="1">SYSTEM ONLINE</text>

  <!-- Scanning Beam -->
  <g class="scanner">
    <rect x="2" y="0" width="896" height="35" fill="url(#beamGrad)" pointer-events="none" />
  </g>

  <!-- ASCII Art Centerpiece -->
  <g class="title-ascii">
    <text x="450" y="92" text-anchor="middle">███████╗███╗   ██╗██╗██████╗ ██╗   ██╗ ██████╗  █████╗ </text>
    <text x="450" y="110" text-anchor="middle">██╔════╝████╗  ██║██║██╔══██╗╚██╗ ██╔╝██╔═████╗██╔══██╗</text>
    <text x="450" y="128" text-anchor="middle">███████╗██╔██╗ ██║██║██████╔╝ ╚████╔╝ ██║██╔██║╚██████║</text>
    <text x="450" y="146" text-anchor="middle">╚════██║██║╚██╗██║██║██╔═══╝   ╚██╔╝  ████╔╝██║ ╚═══██║</text>
    <text x="450" y="164" text-anchor="middle">███████║██║ ╚████║██║██║        ██║   ╚██████╔╝ █████╔╝</text>
    <text x="450" y="182" text-anchor="middle">╚══════╝╚═╝  ╚═══╝╚═╝╚═╝        ╚═╝    ╚═════╝  ╚════╝ </text>
  </g>

  <!-- Subtitle Badge -->
  <text x="450" y="216" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8" letter-spacing="2">SAJAL KUMAR MISHRA • SYSTEMS ARCHITECT &amp; FULL-STACK BUILDER</text>

  <!-- Divider -->
  <line x1="45" y1="240" x2="855" y2="240" stroke="#1e293b" stroke-dasharray="4,4" />

  <!-- Bottom Console Output -->
  <g class="mono" font-size="11.5">
    <text x="50" y="272" fill="#64748b">ROOT@SNIPY09:~$ <tspan fill="#bae2fd">init --engine=nomadic --perception=active --mode=ship</tspan></text>
    <text x="50" y="295" fill="#0284c7">» <tspan fill="#cbd5e1">High-Throughput Automation | OmniForm DOM Solver | Sub-30ms Client Engine</tspan><tspan fill="#38bdf8" class="cursor-blink"> █</tspan></text>
  </g>
</svg>
