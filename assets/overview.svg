<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="barGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes bar1 { 0% { width: 0; } 100% { width: 340px; } }
    @keyframes bar2 { 0% { width: 0; } 100% { width: 320px; } }
    @keyframes bar3 { 0% { width: 0; } 100% { width: 295px; } }
    @keyframes bar4 { 0% { width: 0; } 100% { width: 275px; } }
    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 0.2; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .b-1 { animation: bar1 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .b-2 { animation: bar2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .b-3 { animation: bar3 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .b-4 { animation: bar4 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .radar-ring { animation: radarPulse 2.8s ease-in-out infinite; transform-origin: 825px 48px; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Split Line -->
  <line x1="450" y1="20" x2="450" y2="220" stroke="#1e293b" stroke-dasharray="3,3" />

  <!-- LEFT PANEL: Architectural Disciplines -->
  <text x="35" y="42" class="mono" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.2">┌─ CORE DISCIPLINES &amp; METRICS ─────────┐</text>

  <!-- Metric 1 -->
  <text x="35" y="72" class="sans" font-size="12" fill="#cbd5e1" font-weight="500">DOM Perception &amp; Form Automation</text>
  <text x="415" y="72" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">98%</text>
  <rect x="35" y="78" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="78" height="5" rx="2.5" fill="url(#cyanBar)" class="b-1" filter="url(#barGlow)" />

  <!-- Metric 2 -->
  <text x="35" y="110" class="sans" font-size="12" fill="#cbd5e1" font-weight="500">Full-Stack &amp; Reactive Architectures</text>
  <text x="415" y="110" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">94%</text>
  <rect x="35" y="116" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="116" height="5" rx="2.5" fill="url(#cyanBar)" class="b-2" filter="url(#barGlow)" />

  <!-- Metric 3 -->
  <text x="35" y="148" class="sans" font-size="12" fill="#cbd5e1" font-weight="500">Database Design &amp; Schema RLS Security</text>
  <text x="415" y="148" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">88%</text>
  <rect x="35" y="154" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="154" height="5" rx="2.5" fill="url(#cyanBar)" class="b-3" filter="url(#barGlow)" />

  <!-- Metric 4 -->
  <text x="35" y="186" class="sans" font-size="12" fill="#cbd5e1" font-weight="500">Desktop Run &amp; Browser CDP Automation</text>
  <text x="415" y="186" class="mono" font-size="11" fill="#bae2fd" text-anchor="end">82%</text>
  <rect x="35" y="192" width="380" height="5" rx="2.5" fill="#1e293b" />
  <rect x="35" y="192" height="5" rx="2.5" fill="url(#cyanBar)" class="b-4" filter="url(#barGlow)" />

  <!-- RIGHT PANEL: Flagship Product Engine -->
  <text x="480" y="42" class="mono" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.2">┌─ FLAGSHIP :: NOMADIC OS ─────────────┐</text>

  <!-- Radar Pulse Signal -->
  <circle cx="825" cy="48" r="14" fill="none" stroke="#0284c7" stroke-width="1.2" class="radar-ring" />
  <circle cx="825" cy="48" r="4.5" fill="#38bdf8" />

  <g class="mono" font-size="11">
    <text x="480" y="74" fill="#64748b">CORE      :: <tspan fill="#ffffff" font-weight="600">Universal Career OS &amp; Pilot</tspan></text>
    <text x="480" y="98" fill="#64748b">LIVE URL  :: <tspan fill="#bae2fd">nomadicai.vercel.app</tspan></text>
    <text x="480" y="122" fill="#64748b">ENGINE    :: <tspan fill="#e2e8f0">OmniForm React DOM Prototype Setter</tspan></text>
    <text x="480" y="146" fill="#64748b">LATENCY   :: <tspan fill="#38bdf8">&lt; 30ms Client Query State Sync</tspan></text>
  </g>

  <!-- Architecture Badges -->
  <g class="mono" font-size="10">
    <rect x="480" y="174" width="75" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="517" y="190" text-anchor="middle" fill="#cbd5e1">React 18</text>

    <rect x="562" y="174" width="80" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="602" y="190" text-anchor="middle" fill="#cbd5e1">Supabase</text>

    <rect x="649" y="174" width="75" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="686" y="190" text-anchor="middle" fill="#cbd5e1">Electron</text>

    <rect x="731" y="174" width="105" height="24" rx="4" fill="#031d33" stroke="#0284c7" stroke-width="1" />
    <text x="783" y="190" text-anchor="middle" fill="#38bdf8" font-weight="700">OmniForm v1.0</text>
  </g>
</svg>
