<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
  </defs>

  <style>
    @keyframes chipGlow {
      0%, 100% { stroke: #1e293b; }
      50% { stroke: #0284c7; }
    }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .chip {
      animation: chipGlow 4s ease-in-out infinite;
    }
    .chip-1 { animation-delay: 0s; }
    .chip-2 { animation-delay: 0.5s; }
    .chip-3 { animation-delay: 1.0s; }
    .chip-4 { animation-delay: 1.5s; }
    .chip-5 { animation-delay: 2.0s; }
    .chip-6 { animation-delay: 2.5s; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="126" rx="12" fill="url(#bgStack)" stroke="#1e293b" stroke-width="1.5" />

  <text x="35" y="32" class="mono" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">┌─ ACTIVE TOOLCHAIN &amp; RUNTIME MODULES ────────────────────────────────────┐</text>

  <!-- Row 1 -->
  <g class="mono" font-size="11">
    <rect x="35" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-1" />
    <text x="97" y="66" text-anchor="middle" fill="#e2e8f0">TypeScript</text>

    <rect x="175" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-2" />
    <text x="237" y="66" text-anchor="middle" fill="#e2e8f0">React 18 / Next</text>

    <rect x="315" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-3" />
    <text x="377" y="66" text-anchor="middle" fill="#e2e8f0">Node.js / Express</text>

    <rect x="455" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-4" />
    <text x="517" y="66" text-anchor="middle" fill="#e2e8f0">Python 3.11</text>

    <rect x="595" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-5" />
    <text x="657" y="66" text-anchor="middle" fill="#e2e8f0">Supabase / SQL</text>

    <rect x="735" y="48" width="125" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" class="chip chip-6" />
    <text x="797" y="66" text-anchor="middle" fill="#e2e8f0">Electron / Desktop</text>
  </g>

  <!-- Row 2 -->
  <g class="mono" font-size="11">
    <rect x="35" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-6" />
    <text x="97" y="102" text-anchor="middle" fill="#94a3b8">PostgreSQL</text>

    <rect x="175" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-5" />
    <text x="237" y="102" text-anchor="middle" fill="#94a3b8">TailwindCSS</text>

    <rect x="315" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-4" />
    <text x="377" y="102" text-anchor="middle" fill="#94a3b8">CDP Automation</text>

    <rect x="455" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-3" />
    <text x="517" y="102" text-anchor="middle" fill="#94a3b8">Docker / Vercel</text>

    <rect x="595" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-2" />
    <text x="657" y="102" text-anchor="middle" fill="#94a3b8">Git / GitHub</text>

    <rect x="735" y="84" width="125" height="28" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="1" class="chip chip-1" />
    <text x="797" y="102" text-anchor="middle" fill="#94a3b8">Linux / Bash</text>
  </g>
</svg>
