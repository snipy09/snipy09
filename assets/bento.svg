<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <linearGradient id="nomadicCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182b" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="meshAmbient" cx="15%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Border Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#bae2fd" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes borderBeam {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: -600; }
    }
    @keyframes tileGlow {
      0%, 100% { stroke: #1e293b; }
      50% { stroke: #0284c7; }
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
    }
    .live-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 32px 34px;
    }
    .radar-dot {
      animation: pulseDot 2.4s ease-in-out infinite;
      transform-origin: 878px 36px;
    }
    .beam-stroke {
      stroke-dasharray: 120 480;
      animation: borderBeam 6s linear infinite;
    }
    .tech-tile {
      animation: tileGlow 4s ease-in-out infinite;
    }
    .t-1 { animation-delay: 0s; }
    .t-2 { animation-delay: 0.8s; }
    .t-3 { animation-delay: 1.6s; }
    .t-4 { animation-delay: 2.4s; }
    .t-5 { animation-delay: 3.2s; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="920" height="460" rx="4" fill="url(#bgCanvas)" />
  <rect x="0" y="0" width="920" height="460" rx="4" fill="url(#meshAmbient)" pointer-events="none" />

  <!-- ==================== CARD 1: IDENTITY & ROLE (Top Left) ==================== -->
  <g transform="translate(16, 16)">
    <!-- Sharp Card -->
    <rect x="0" y="0" width="550" height="235" rx="3" fill="url(#cardDark)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Top Status Indicator -->
    <rect x="20" y="20" width="130" height="24" rx="2" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
    <circle cx="32" cy="32" r="3.5" fill="#38bdf8" class="live-dot" />
    <text x="44" y="36" class="mono" font-size="10" font-weight="700" fill="#bae2fd" letter-spacing="1">SYS_ACTIVE</text>

    <rect x="158" y="20" width="105" height="24" rx="2" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="210" y="36" class="mono" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">UTC+05:30</text>

    <!-- Name & Role -->
    <text x="20" y="86" class="sans" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.3">Sajal Kumar Mishra</text>
    <text x="20" y="112" class="mono" font-size="12" font-weight="600" fill="#bae2fd" letter-spacing="0.5">SYSTEMS &amp; FULL-STACK ARCHITECT</text>

    <!-- Bio (Direct & Honest, No AI Fluff) -->
    <text x="20" y="145" class="sans" font-size="12.5" font-weight="400" fill="#cbd5e1">
      Building high-throughput client engines, resilient browser automation harnesses,
    </text>
    <text x="20" y="165" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">
      and scalable production web &amp; desktop applications.
    </text>

    <!-- Sharp Domain Tiles -->
    <g class="mono" font-size="10">
      <rect x="20" y="190" width="115" height="24" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" />
      <text x="77" y="206" text-anchor="middle" fill="#cbd5e1">DOM SOLVERS</text>

      <rect x="143" y="190" width="125" height="24" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" />
      <text x="205" y="206" text-anchor="middle" fill="#cbd5e1">REACT 18 / NEXT</text>

      <rect x="276" y="190" width="115" height="24" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" />
      <text x="333" y="206" text-anchor="middle" fill="#cbd5e1">SUPABASE RLS</text>

      <rect x="399" y="190" width="130" height="24" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" />
      <text x="464" y="206" text-anchor="middle" fill="#cbd5e1">ELECTRON DESKTOP</text>
    </g>
  </g>

  <!-- ==================== CARD 2: NOMADIC SPOTLIGHT (Top Right) ==================== -->
  <g transform="translate(582, 16)">
    <!-- Sharp Card with Animated Beam -->
    <rect x="0" y="0" width="322" height="235" rx="3" fill="url(#nomadicCard)" stroke="#0284c7" stroke-width="1.2" />
    <rect x="0" y="0" width="322" height="235" rx="3" fill="none" stroke="url(#beamGrad)" stroke-width="2" class="beam-stroke" />

    <text x="20" y="36" class="mono" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">FLAGSHIP PRODUCT</text>
    
    <rect x="238" y="20" width="64" height="22" rx="2" fill="#0284c7" />
    <text x="270" y="35" class="mono" font-size="9.5" fill="#ffffff" font-weight="800" text-anchor="middle">ALPHA</text>

    <!-- Product Header -->
    <text x="20" y="76" class="sans" font-size="22" font-weight="800" fill="#ffffff">Nomadic</text>
    <text x="20" y="96" class="mono" font-size="11" font-weight="600" fill="#bae2fd">Universal Career OS</text>

    <!-- Direct Technical Bullets -->
    <g class="mono" font-size="10.5">
      <text x="20" y="128" fill="#64748b">ENGINE  :: <tspan fill="#e2e8f0">OmniForm React DOM Setter</tspan></text>
      <text x="20" y="150" fill="#64748b">LATENCY :: <tspan fill="#38bdf8">&lt; 30ms Client Pagination</tspan></text>
      <text x="20" y="172" fill="#64748b">BUILD   :: <tspan fill="#cbd5e1">Electron Native + Supabase</tspan></text>
    </g>

    <!-- Sharp Action Button -->
    <rect x="20" y="190" width="282" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" />
    <text x="161" y="207" class="mono" font-size="10.5" font-weight="600" fill="#bae2fd" text-anchor="middle">nomadicai.vercel.app ↗</text>
  </g>

  <!-- ==================== CARD 3: TECH MATRIX (Bottom Left) ==================== -->
  <g transform="translate(16, 267)">
    <rect x="0" y="0" width="435" height="177" rx="3" fill="url(#cardDark)" stroke="#1e293b" stroke-width="1.2" />

    <text x="20" y="30" class="mono" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1">TOOLCHAIN &amp; ACTIVE STACK</text>

    <!-- Sharp Tech Tiles Grid -->
    <g class="mono" font-size="10.5">
      <!-- Row 1 -->
      <rect x="20" y="46" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-1" />
      <text x="67" y="63" text-anchor="middle" fill="#e2e8f0">TypeScript</text>

      <rect x="122" y="46" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-2" />
      <text x="169" y="63" text-anchor="middle" fill="#e2e8f0">React 18</text>

      <rect x="224" y="46" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-3" />
      <text x="271" y="63" text-anchor="middle" fill="#e2e8f0">Next.js</text>

      <rect x="326" y="46" width="88" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-4" />
      <text x="370" y="63" text-anchor="middle" fill="#e2e8f0">Node.js</text>

      <!-- Row 2 -->
      <rect x="20" y="80" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-5" />
      <text x="67" y="97" text-anchor="middle" fill="#e2e8f0">Python 3.11</text>

      <rect x="122" y="80" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-1" />
      <text x="169" y="97" text-anchor="middle" fill="#e2e8f0">Supabase</text>

      <rect x="224" y="80" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-2" />
      <text x="271" y="97" text-anchor="middle" fill="#e2e8f0">PostgreSQL</text>

      <rect x="326" y="80" width="88" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-3" />
      <text x="370" y="97" text-anchor="middle" fill="#e2e8f0">Electron</text>

      <!-- Row 3 -->
      <rect x="20" y="114" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-4" />
      <text x="67" y="131" text-anchor="middle" fill="#94a3b8">TailwindCSS</text>

      <rect x="122" y="114" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-5" />
      <text x="169" y="131" text-anchor="middle" fill="#94a3b8">Chrome CDP</text>

      <rect x="224" y="114" width="94" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-1" />
      <text x="271" y="131" text-anchor="middle" fill="#94a3b8">Docker</text>

      <rect x="326" y="114" width="88" height="26" rx="2" fill="#09090b" stroke="#1e293b" stroke-width="0.8" class="tech-tile t-2" />
      <text x="370" y="131" text-anchor="middle" fill="#94a3b8">Git / CI</text>
    </g>
  </g>

  <!-- ==================== CARD 4: ENGINEERING MECHANICS (Bottom Right) ==================== -->
  <g transform="translate(467, 267)">
    <rect x="0" y="0" width="437" height="177" rx="3" fill="url(#cardDark)" stroke="#1e293b" stroke-width="1.2" />

    <text x="20" y="30" class="mono" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE RULES</text>

    <!-- Point 1 -->
    <g transform="translate(20, 48)">
      <rect x="0" y="2" width="20" height="16" rx="2" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
      <text x="10" y="14" class="mono" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">01</text>
      <text x="28" y="14" class="sans" font-size="12" font-weight="600" fill="#ffffff">DOM Prototype Setters</text>
      <text x="28" y="29" class="sans" font-size="11" font-weight="400" fill="#94a3b8">React 18 native value trackers for synthetic event reconciliation.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(20, 88)">
      <rect x="0" y="2" width="20" height="16" rx="2" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
      <text x="10" y="14" class="mono" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">02</text>
      <text x="28" y="14" class="sans" font-size="12" font-weight="600" fill="#ffffff">Sub-30ms State Normalization</text>
      <text x="28" y="29" class="sans" font-size="11" font-weight="400" fill="#94a3b8">Pre-computed client caches with instant optimistic rendering.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(20, 128)">
      <rect x="0" y="2" width="20" height="16" rx="2" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
      <text x="10" y="14" class="mono" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">03</text>
      <text x="28" y="14" class="sans" font-size="12" font-weight="600" fill="#ffffff">Strict Tier &amp; Security Validation</text>
      <text x="28" y="29" class="sans" font-size="11" font-weight="400" fill="#94a3b8">Server-verified RLS policies, zero hardcoded credentials, locked devtools.</text>
    </g>
  </g>
</svg>
