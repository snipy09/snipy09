<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Mesh Gradient -->
    <radialGradient id="meshGrad" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <linearGradient id="flagshipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081528" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Text Glow -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#bae2fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.4; }
    }
    @keyframes borderShimmer {
      0%, 100% { stroke: #1e293b; }
      50% { stroke: #0284c7; }
    }
    @keyframes chipShimmer {
      0%, 100% { border-color: #1e293b; }
      50% { border-color: #38bdf8; }
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
    }
    .status-pulse {
      animation: pulseLive 2.2s ease-in-out infinite;
      transform-origin: 36px 36px;
    }
    .card-border-animated {
      animation: borderShimmer 4s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect x="0" y="0" width="920" height="460" rx="16" fill="#06070a" />
  <rect x="0" y="0" width="920" height="460" rx="16" fill="url(#meshGrad)" pointer-events="none" />

  <!-- ==================== CARD 1: HERO IDENTITY (Top Left) ==================== -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="550" height="235" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Top Status Pill -->
    <rect x="24" y="24" width="165" height="24" rx="12" fill="#031d33" stroke="#0284c7" stroke-width="0.8" />
    <circle cx="36" cy="36" r="3.5" fill="#38bdf8" class="status-pulse" />
    <text x="48" y="40" class="mono" font-size="10.5" font-weight="700" fill="#bae2fd" letter-spacing="0.5">SHIPPING SYSTEMS</text>

    <!-- Location Pill -->
    <rect x="198" y="24" width="115" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="255" y="40" class="mono" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="middle">UTC+05:30</text>

    <!-- Name & Title -->
    <text x="24" y="94" class="sans" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Sajal Kumar Mishra</text>
    <text x="24" y="120" class="sans" font-size="13.5" font-weight="600" fill="#bae2fd" letter-spacing="0.2">Systems Architect &amp; Full-Stack Builder</text>

    <!-- Bio -->
    <text x="24" y="152" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">
      Specializing in autonomous DOM perception engines, sub-30ms reactive client
    </text>
    <text x="24" y="172" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">
      architectures, and high-throughput resilient software.
    </text>

    <!-- Footer Tags -->
    <g class="mono" font-size="10">
      <rect x="24" y="192" width="105" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="76" y="207" text-anchor="middle" fill="#cbd5e1">DOM ENGINES</text>

      <rect x="137" y="192" width="115" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="194" y="207" text-anchor="middle" fill="#cbd5e1">REACT 18 / NEXT</text>

      <rect x="260" y="192" width="110" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="315" y="207" text-anchor="middle" fill="#cbd5e1">SUPABASE RLS</text>

      <rect x="378" y="192" width="95" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="425" y="207" text-anchor="middle" fill="#cbd5e1">ELECTRON</text>
    </g>
  </g>

  <!-- ==================== CARD 2: FLAGSHIP PRODUCT (Top Right) ==================== -->
  <g transform="translate(582, 16)">
    <rect x="0" y="0" width="322" height="235" rx="12" fill="url(#flagshipBg)" stroke="#0284c7" stroke-width="1" />

    <text x="22" y="38" class="mono" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">FLAGSHIP PRODUCT</text>
    <rect x="240" y="24" width="60" height="20" rx="4" fill="#0284c7" />
    <text x="270" y="38" class="mono" font-size="9.5" fill="#ffffff" font-weight="800" text-anchor="middle">ALPHA</text>

    <!-- Product Title -->
    <text x="22" y="78" class="sans" font-size="22" font-weight="800" fill="#ffffff">Nomadic OS</text>
    <text x="22" y="98" class="sans" font-size="12" font-weight="500" fill="#bae2fd">Universal Career Operating System</text>

    <!-- Specs List -->
    <g class="mono" font-size="10.5">
      <text x="22" y="130" fill="#64748b">ENGINE  :: <tspan fill="#e2e8f0">OmniForm DOM Solver</tspan></text>
      <text x="22" y="152" fill="#64748b">LATENCY :: <tspan fill="#38bdf8">&lt; 30ms Query State</tspan></text>
      <text x="22" y="174" fill="#64748b">STACK   :: <tspan fill="#cbd5e1">React 18 + Supabase</tspan></text>
    </g>

    <!-- URL Button -->
    <rect x="22" y="192" width="278" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="161" y="209" class="mono" font-size="10.5" font-weight="600" fill="#bae2fd" text-anchor="middle">nomadicai.vercel.app ↗</text>
  </g>

  <!-- ==================== CARD 3: TECH MATRIX (Bottom Left) ==================== -->
  <g transform="translate(16, 267)">
    <rect x="0" y="0" width="435" height="177" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />

    <text x="22" y="32" class="mono" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1.2">CORE TECH MATRIX</text>

    <!-- Chips Grid -->
    <g class="mono" font-size="10.5">
      <!-- Row 1 -->
      <rect x="22" y="48" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="68" y="65" text-anchor="middle" fill="#e2e8f0">TypeScript</text>

      <rect x="122" y="48" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="168" y="65" text-anchor="middle" fill="#e2e8f0">React 18</text>

      <rect x="222" y="48" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="268" y="65" text-anchor="middle" fill="#e2e8f0">Next.js</text>

      <rect x="322" y="48" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="368" y="65" text-anchor="middle" fill="#e2e8f0">Node.js</text>

      <!-- Row 2 -->
      <rect x="22" y="82" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="68" y="99" text-anchor="middle" fill="#e2e8f0">Python</text>

      <rect x="122" y="82" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="168" y="99" text-anchor="middle" fill="#e2e8f0">Supabase</text>

      <rect x="222" y="82" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="268" y="99" text-anchor="middle" fill="#e2e8f0">Postgres</text>

      <rect x="322" y="82" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="368" y="99" text-anchor="middle" fill="#e2e8f0">Electron</text>

      <!-- Row 3 -->
      <rect x="22" y="116" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="68" y="133" text-anchor="middle" fill="#94a3b8">Tailwind</text>

      <rect x="122" y="116" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="168" y="133" text-anchor="middle" fill="#94a3b8">CDP / DOM</text>

      <rect x="222" y="116" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="268" y="133" text-anchor="middle" fill="#94a3b8">Docker</text>

      <rect x="322" y="116" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="368" y="133" text-anchor="middle" fill="#94a3b8">Git / CI</text>
    </g>
  </g>

  <!-- ==================== CARD 4: ARCHITECTURE PRINCIPLES (Bottom Right) ==================== -->
  <g transform="translate(467, 267)">
    <rect x="0" y="0" width="437" height="177" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />

    <text x="22" y="32" class="mono" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1.2">ENGINEERING PRINCIPLES</text>

    <!-- Point 1 -->
    <g transform="translate(22, 48)">
      <circle cx="5" cy="8" r="3" fill="#0284c7" />
      <text x="16" y="11" class="sans" font-size="12" font-weight="600" fill="#ffffff">Autonomous Perception Loops</text>
      <text x="16" y="28" class="sans" font-size="11" font-weight="400" fill="#94a3b8">Multi-pass prototype setter injection with dynamic arbitration.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(22, 90)">
      <circle cx="5" cy="8" r="3" fill="#0284c7" />
      <text x="16" y="11" class="sans" font-size="12" font-weight="600" fill="#ffffff">Sub-30ms Query Latency</text>
      <text x="16" y="28" class="sans" font-size="11" font-weight="400" fill="#94a3b8">Optimized client caches, synchronous state normalization &amp; RLS.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(22, 132)">
      <circle cx="5" cy="8" r="3" fill="#0284c7" />
      <text x="16" y="11" class="sans" font-size="12" font-weight="600" fill="#ffffff">Deterministic System Integrity</text>
      <text x="16" y="28" class="sans" font-size="11" font-weight="400" fill="#94a3b8">Zero-hardcoded vulnerability, strict verification &amp; continuous ops.</text>
    </g>
  </g>
</svg>
