<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae2fd" />
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePoint {
      0%, 100% { r: 4; opacity: 1; }
      50% { r: 6.5; opacity: 0.5; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes sweep {
      0% { opacity: 0.2; transform: translateX(-100px); }
      50% { opacity: 0.8; }
      100% { opacity: 0.2; transform: translateX(900px); }
    }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    .chart-line {
      stroke-dasharray: 2000;
      animation: dashMove 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .p-pulse {
      animation: pulsePoint 2s ease-in-out infinite;
    }
    .p-2 { animation-delay: 0.5s; }
    .p-3 { animation-delay: 1.0s; }
    .p-4 { animation-delay: 1.5s; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="256" rx="12" fill="#09090b" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & KPI Header -->
  <g class="mono">
    <text x="30" y="32" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1">┌─ SYSTEM ACTIVITY &amp; EXECUTION VELOCITY ────────────────────────────────┐</text>
    
    <!-- Top Stats Row -->
    <text x="35" y="60" font-size="10" fill="#64748b">EXECUTION RATE</text>
    <text x="35" y="76" font-size="14" fill="#ffffff" font-weight="700">99.8% <tspan font-size="10" fill="#38bdf8">UPTIME</tspan></text>

    <text x="240" y="60" font-size="10" fill="#64748b">PERCEPTION LATENCY</text>
    <text x="240" y="76" font-size="14" fill="#ffffff" font-weight="700">&lt; 30ms <tspan font-size="10" fill="#38bdf8">CLIENT SYNC</tspan></text>

    <text x="465" y="60" font-size="10" fill="#64748b">DOM SOLVER ACCURACY</text>
    <text x="465" y="76" font-size="14" fill="#ffffff" font-weight="700">98.4% <tspan font-size="10" fill="#38bdf8">OMNIFORM</tspan></text>

    <text x="700" y="60" font-size="10" fill="#64748b">OPERATIONAL STATE</text>
    <text x="700" y="76" font-size="14" fill="#bae2fd" font-weight="700">CONTINUOUS <tspan font-size="10" fill="#38bdf8">●</tspan></text>
  </g>

  <!-- Grid Horizontal Lines -->
  <line x1="35" y1="105" x2="845" y2="105" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="35" y1="145" x2="845" y2="145" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="35" y1="185" x2="845" y2="185" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="35" y1="225" x2="845" y2="225" stroke="#1e293b" stroke-width="1" />

  <!-- Y-Axis Labels -->
  <g class="mono" font-size="9" fill="#475569" text-anchor="end">
    <text x="28" y="108">MAX</text>
    <text x="28" y="148">MID</text>
    <text x="28" y="188">LOW</text>
    <text x="28" y="228">0</text>
  </g>

  <!-- Area Fill Under Graph -->
  <path d="M 50 225 L 50 200 C 85 200, 85 180, 120 180 C 160 180, 160 150, 200 150 C 240 150, 240 170, 280 170 C 320 170, 320 120, 360 120 C 405 120, 405 135, 450 135 C 495 135, 495 90, 540 90 C 585 90, 585 105, 630 105 C 675 105, 675 75, 720 75 C 770 75, 770 60, 830 60 L 830 225 Z" fill="url(#areaGrad)" />

  <!-- Main Animated Curved Line -->
  <path d="M 50 200 C 85 200, 85 180, 120 180 C 160 180, 160 150, 200 150 C 240 150, 240 170, 280 170 C 320 170, 320 120, 360 120 C 405 120, 405 135, 450 135 C 495 135, 495 90, 540 90 C 585 90, 585 105, 630 105 C 675 105, 675 75, 720 75 C 770 75, 770 60, 830 60" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="chart-line" filter="url(#lineGlow)" />

  <!-- Data Points -->
  <circle cx="200" cy="150" r="4" fill="#38bdf8" stroke="#09090b" stroke-width="1.5" class="p-pulse p-1" />
  <circle cx="360" cy="120" r="4" fill="#38bdf8" stroke="#09090b" stroke-width="1.5" class="p-pulse p-2" />
  <circle cx="540" cy="90" r="4" fill="#38bdf8" stroke="#09090b" stroke-width="1.5" class="p-pulse p-3" />
  <circle cx="720" cy="75" r="4" fill="#bae2fd" stroke="#09090b" stroke-width="1.5" class="p-pulse p-4" />
  <circle cx="830" cy="60" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="2" class="p-pulse" />

  <!-- X-Axis Labels -->
  <g class="mono" font-size="9.5" fill="#64748b">
    <text x="50" y="244">INIT</text>
    <text x="200" y="244">ARCH</text>
    <text x="360" y="244">ENGINES</text>
    <text x="540" y="244">OMNIFORM</text>
    <text x="720" y="244">NOMADIC OS</text>
    <text x="830" y="244" text-anchor="end" fill="#38bdf8" font-weight="700">NOW (v1.0.6)</text>
  </g>
</svg>
